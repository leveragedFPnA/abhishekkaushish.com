<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    :root {
      --dl-green: #86BC25;
      --dl-green-dark: #6B9A1E;
      --dl-neon: #86EB22;
      --dl-blue: #00A3E0;
      --dl-blue-dark: #005587;
      --dl-black: #0A0A0A;
      --dl-charcoal: #282728;
      --dl-gray-900: #1A1A1A;
      --dl-gray-100: #F5F5F5;
      --dl-gray-200: #E6E6E6;
      --dl-white: #FFFFFF;
      --navy: #07131e;
      --navy-light: #102d3d;
      --ivory: #e8dfcf;
      --sand: #b5a48c;
      --gold: #c9a96b;
      --coral: #a65d45;
      --water: #17465a;
      --line: rgba(232, 223, 207, .36);
      --mx: 0px;
      --my: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--navy);
    }

    body {
      cursor: crosshair;
    }

    .site-shell,
    .scene,
    .atmosphere,
    .frame {
      position: fixed;
      inset: 0;
    }

    .site-shell {
      overflow: hidden;
      background: var(--navy);
      isolation: isolate;
    }

    .scene {
      overflow: hidden;
      background:
        radial-gradient(circle at 76% 22%, rgba(224, 184, 106, .32), transparent 8%),
        linear-gradient(180deg, #081827 0%, #183d50 48%, #0b2635 100%);
      transition: background 1400ms ease;
    }

    .scene::before {
      position: absolute;
      inset: -10%;
      background:
        radial-gradient(ellipse at 20% 16%, rgba(255, 255, 255, .06), transparent 23%),
        radial-gradient(ellipse at 65% 40%, rgba(255, 255, 255, .045), transparent 26%);
      content: "";
      transform: translate3d(calc(var(--mx) * -.2), calc(var(--my) * -.2), 0);
    }

    .site-shell[data-mode="day"] .scene {
      background:
        radial-gradient(circle at 76% 21%, rgba(255, 242, 193, .95), transparent 10%),
        linear-gradient(180deg, #d8d0bd 0%, #8faab1 45%, #356477 100%);
    }

    .sky-wash {
      position: absolute;
      inset: 0;
      opacity: .7;
      background:
        linear-gradient(120deg, transparent 25%, rgba(231, 205, 159, .12) 50%, transparent 73%),
        radial-gradient(ellipse at 50% 72%, transparent 30%, rgba(4, 13, 22, .32) 88%);
      transform: translate3d(calc(var(--mx) * -.4), calc(var(--my) * -.4), 0);
    }

    .sun {
      position: absolute;
      top: 13%;
      right: 17%;
      width: clamp(72px, 10vw, 150px);
      aspect-ratio: 1;
      border: 1px solid rgba(255, 237, 176, .55);
      border-radius: 50%;
      background: #e6c47e;
      box-shadow:
        0 0 0 20px rgba(225, 181, 103, .06),
        0 0 90px 24px rgba(226, 183, 101, .26);
      transform: translate3d(calc(var(--mx) * -.8), calc(var(--my) * -.8), 0);
      transition: background 1400ms ease, box-shadow 1400ms ease;
    }

    .site-shell[data-mode="day"] .sun {
      background: #fff1c7;
      box-shadow:
        0 0 0 24px rgba(255, 243, 203, .18),
        0 0 110px 36px rgba(255, 232, 164, .42);
    }

    .horizon-light {
      position: absolute;
      right: 0;
      bottom: 39%;
      left: 0;
      height: 14%;
      background: linear-gradient(180deg, transparent, rgba(231, 180, 106, .16), transparent);
      transform: translate3d(calc(var(--mx) * -.25), calc(var(--my) * -.25), 0);
    }

    .sea {
      position: absolute;
      right: -5%;
      bottom: -5%;
      left: -5%;
      height: 49%;
      overflow: hidden;
      background:
        repeating-linear-gradient(177deg, transparent 0 17px, rgba(211, 215, 196, .09) 18px 19px, transparent 20px 38px),
        linear-gradient(180deg, #24566a 0%, #0b2a3b 100%);
      transform: translate3d(calc(var(--mx) * .3), calc(var(--my) * .3), 0);
      transition: background 1400ms ease;
    }

    .site-shell[data-mode="day"] .sea {
      background:
        repeating-linear-gradient(177deg, transparent 0 17px, rgba(239, 231, 205, .18) 18px 19px, transparent 20px 38px),
        linear-gradient(180deg, #5b8991 0%, #1d5267 100%);
    }

    .sea::after {
      position: absolute;
      top: 24%;
      right: 0;
      left: 0;
      height: 1px;
      background: rgba(240, 225, 184, .55);
      box-shadow: 0 28px rgba(240, 225, 184, .19), 0 68px rgba(240, 225, 184, .12);
      content: "";
    }

    .coast-back {
      position: absolute;
      right: -4%;
      bottom: 36%;
      width: 68%;
      height: 25%;
      background: #17323d;
      clip-path: polygon(0 82%, 12% 66%, 23% 68%, 35% 45%, 44% 53%, 54% 30%, 63% 47%, 72% 26%, 83% 42%, 100% 22%, 100% 100%, 0 100%);
      transform: translate3d(calc(var(--mx) * .55), calc(var(--my) * .55), 0);
      transition: background 1400ms ease;
    }

    .site-shell[data-mode="day"] .coast-back {
      background: #557175;
    }

    .coast-front {
      position: absolute;
      right: -5%;
      bottom: 30%;
      width: 58%;
      height: 19%;
      background: #0d202c;
      clip-path: polygon(0 72%, 13% 63%, 25% 66%, 39% 38%, 51% 47%, 67% 25%, 77% 43%, 90% 30%, 100% 35%, 100% 100%, 0 100%);
      transform: translate3d(calc(var(--mx) * .8), calc(var(--my) * .8), 0);
      transition: background 1400ms ease;
    }

    .site-shell[data-mode="day"] .coast-front {
      background: #304f59;
    }

    .architecture {
      position: absolute;
      right: 13%;
      bottom: 35%;
      width: 36%;
      height: 29%;
      transform: translate3d(calc(var(--mx) * .95), calc(var(--my) * .95), 0);
    }

    .building {
      position: absolute;
      bottom: 0;
      border-top: 2px solid rgba(236, 220, 175, .55);
      background: #182b35;
      box-shadow: 0 0 0 1px rgba(8, 15, 22, .36);
      transition: background 1400ms ease;
    }

    .site-shell[data-mode="day"] .building {
      background: #788283;
    }

    .building::after {
      position: absolute;
      inset: 18% 12%;
      background:
        repeating-linear-gradient(90deg, rgba(220, 192, 126, .56) 0 4px, transparent 4px 13px),
        repeating-linear-gradient(180deg, rgba(220, 192, 126, .5) 0 3px, transparent 3px 14px);
      content: "";
      opacity: .56;
    }

    .building-one {
      left: 0;
      width: 22%;
      height: 47%;
    }

    .building-two {
      left: 21%;
      width: 28%;
      height: 68%;
    }

    .building-three {
      left: 48%;
      width: 23%;
      height: 56%;
    }

    .building-four {
      right: 0;
      width: 29%;
      height: 82%;
    }

    .dome {
      position: absolute;
      right: 7%;
      bottom: 79%;
      width: 18%;
      aspect-ratio: 1.6;
      border: 2px solid rgba(230, 199, 129, .6);
      border-bottom: 0;
      border-radius: 100% 100% 0 0;
      background: #263c42;
    }

    .tower {
      position: absolute;
      right: 31%;
      bottom: 72%;
      width: 9%;
      height: 31%;
      border-top: 2px solid rgba(230, 199, 129, .6);
      background: #21343a;
    }

    .tower::after {
      position: absolute;
      top: -13%;
      left: -24%;
      width: 148%;
      height: 14%;
      border: 1px solid rgba(230, 199, 129, .56);
      border-radius: 50%;
      content: "";
    }

    .yacht {
      position: absolute;
      bottom: 15%;
      left: 47%;
      width: clamp(160px, 22vw, 300px);
      height: 110px;
      transform: translate3d(calc(var(--mx) * 1.2), calc(var(--my) * 1.2), 0);
    }

    .yacht-hull {
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 100%;
      height: 26px;
      border-radius: 0 0 58% 22%;
      background: #e1d8c5;
      clip-path: polygon(0 0, 100% 0, 83% 78%, 20% 100%, 7% 70%);
    }

    .yacht-deck {
      position: absolute;
      bottom: 37px;
      left: 19%;
      width: 60%;
      height: 16px;
      border-top: 2px solid var(--gold);
      background: #b9ad97;
      clip-path: polygon(9% 0, 91% 0, 100% 100%, 0 100%);
    }

    .yacht-mast {
      position: absolute;
      bottom: 47px;
      left: 51%;
      width: 2px;
      height: 60px;
      background: var(--ivory);
    }

    .yacht-sail {
      position: absolute;
      bottom: 51px;
      left: 52%;
      width: 36px;
      height: 48px;
      border-right: 1px solid rgba(239, 232, 212, .82);
      background: rgba(239, 232, 212, .58);
      clip-path: polygon(0 100%, 100% 0, 100% 100%);
    }

    .marina-line {
      position: absolute;
      bottom: 14%;
      left: 36%;
      width: 35%;
      height: 1px;
      background: rgba(221, 205, 168, .5);
      box-shadow: 0 7px rgba(221, 205, 168, .17);
      transform: translate3d(calc(var(--mx) * .6), calc(var(--my) * .6), 0);
    }

    .pattern {
      position: absolute;
      inset: 0;
      opacity: .095;
      background-image:
        linear-gradient(30deg, transparent 48%, var(--ivory) 49%, transparent 51%),
        linear-gradient(150deg, transparent 48%, var(--ivory) 49%, transparent 51%);
      background-size: 42px 72px;
      mix-blend-mode: screen;
      transform: translate3d(calc(var(--mx) * -.55), calc(var(--my) * -.55), 0) scale(1.15);
    }

    .atmosphere {
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, transparent 44%, rgba(1, 7, 12, .48) 100%),
        linear-gradient(90deg, rgba(4, 12, 18, .16), transparent 24%, transparent 76%, rgba(4, 12, 18, .18));
      mix-blend-mode: multiply;
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: .16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.24'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .frame {
      z-index: 4;
      pointer-events: none;
      border: 1px solid var(--line);
      inset: 5.5%;
      transition: border-color 1400ms ease;
    }

    .site-shell[data-mode="day"] .frame {
      --line: rgba(34, 43, 42, .42);
    }

    .frame::before,
    .frame::after {
      position: absolute;
      width: 58px;
      height: 58px;
      border-color: var(--gold);
      content: "";
    }

    .frame::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid;
      border-left: 2px solid;
    }

    .frame::after {
      right: -1px;
      bottom: -1px;
      border-right: 2px solid;
      border-bottom: 2px solid;
    }

    .seal {
      position: absolute;
      top: 8%;
      left: 7%;
      width: 52px;
      aspect-ratio: 1;
      border: 1px solid rgba(221, 189, 119, .72);
      border-radius: 50%;
      opacity: .9;
    }

    .seal::before,
    .seal::after {
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(221, 189, 119, .6);
      border-radius: 50%;
      content: "";
    }

    .seal::after {
      inset: 18px 7px;
      border-width: 1px 0;
      border-radius: 0;
      transform: rotate(45deg);
    }

    .mode-orb {
      position: absolute;
      top: 7%;
      right: 7%;
      width: 46px;
      aspect-ratio: 1;
      padding: 0;
      border: 1px solid rgba(221, 189, 119, .75);
      border-radius: 50%;
      background: rgba(4, 14, 22, .18);
      cursor: pointer;
      pointer-events: auto;
      transition: background 300ms ease, border-color 300ms ease, transform 180ms ease;
    }

    .mode-orb:hover,
    .mode-orb:focus-visible {
      border-color: var(--ivory);
      outline: none;
      transform: scale(1.08);
    }

    .mode-orb::before {
      position: absolute;
      inset: 10px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      content: "";
    }

    .mode-orb span {
      position: absolute;
      top: 19px;
      left: 19px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--dl-green);
      box-shadow: 0 0 12px rgba(134, 188, 37, .8);
    }

    .site-shell[data-mode="day"] .mode-orb {
      background: rgba(239, 232, 212, .2);
      border-color: rgba(36, 51, 53, .6);
    }

    @media (max-width: 760px) {
      body {
        cursor: default;
      }

      .architecture {
        right: -8%;
        width: 72%;
      }

      .yacht {
        bottom: 18%;
        left: 25%;
      }

      .frame {
        inset: 4%;
      }

      .seal {
        top: 7%;
        left: 7%;
        transform: scale(.82);
      }

      .mode-orb {
        top: 6%;
        right: 7%;
        transform: scale(.9);
      }

      .frame::before,
      .frame::after {
        width: 38px;
        height: 38px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="site-shell" id="site" data-mode="night">
    <div class="scene" aria-hidden="true">
      <div class="sky-wash"></div>
      <div class="sun"></div>
      <div class="horizon-light"></div>
      <div class="sea"></div>
      <div class="coast-back"></div>
      <div class="coast-front"></div>

      <div class="architecture">
        <div class="building building-one"></div>
        <div class="building building-two"></div>
        <div class="building building-three"></div>
        <div class="building building-four"></div>
        <div class="dome"></div>
        <div class="tower"></div>
      </div>

      <div class="marina-line"></div>

      <div class="yacht">
        <div class="yacht-hull"></div>
        <div class="yacht-deck"></div>
        <div class="yacht-mast"></div>
        <div class="yacht-sail"></div>
      </div>

      <div class="pattern"></div>
    </div>

    <div class="atmosphere" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="frame" aria-hidden="true">
      <div class="seal"></div>
      <button class="mode-orb" id="mode-orb" type="button" aria-label="Change visual atmosphere">
        <span></span>
      </button>
    </div>
  </div>

  <script>
    (() => {
      const site = document.getElementById("site");
      const modeOrb = document.getElementById("mode-orb");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const target = { x: 0, y: 0 };
      const current = { x: 0, y: 0 };

      function updatePointer(event) {
        target.x = (event.clientX / window.innerWidth - .5) * 2;
        target.y = (event.clientY / window.innerHeight - .5) * 2;
      }

      function resetPointer() {
        target.x = 0;
        target.y = 0;
      }

      function toggleAtmosphere() {
        const isDay = site.dataset.mode === "day";
        site.dataset.mode = isDay ? "night" : "day";
      }

      function render() {
        current.x += (target.x - current.x) * .045;
        current.y += (target.y - current.y) * .045;
        site.style.setProperty("--mx", `${current.x * 22}px`);
        site.style.setProperty("--my", `${current.y * 16}px`);

        if (!reducedMotion.matches) {
          window.requestAnimationFrame(render);
        }
      }

      window.addEventListener("pointermove", updatePointer, { passive: true });
      window.addEventListener("pointerleave", resetPointer);
      modeOrb.addEventListener("click", toggleAtmosphere);
      render();
    })();
  </script>
</body>
</html>
